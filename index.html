<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script defer src="./js/script.js"></script>
    <script defer src="./js/libreria.js"></script>
    <script src="./js/axios@1.13.min.js"></script>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

    <title>Random user generatore</title>
</head>

<body class="bg-light">

    <nav id="navbar" class="navbar navbar-expand-lg ">
        <div class="container-fluid" >
            <a class="navbar-brand" href="#">RandomUser</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link active" aria-current="page" href="./index.html">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="./preferiti.html">Preferiti</a>
                </li>
            </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-5 d-flex align-items-center justify-content-center">
    <div class="col-md-8">
        <div class="main-card p-4">

        <h2 class="text-center mb-4">Random User Generator</h2>

        
        <div class="row mb-4">

            
            <div class="col-md-4 mb-3">
            <label class="label-title">Sesso</label>
            <select id="gender" class="form-select">
                <option value="">Qualsiasi</option>
                <option value="male">Maschio</option>
                <option value="female">Femmina</option>
            </select>
            </div>

            
            <div class="col-md-4 mb-3">
            <label class="label-title">Nazionalità</label>
            <div class="row" id="nationCheckboxes">
                <div class="col-6">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" value="AU" id="au">
                    <label class="form-check-label" for="au">Australia</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" value="DE" id="de">
                    <label class="form-check-label" for="de">Germania</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" value="ES" id="es">
                    <label class="form-check-label" for="es">Spagna</label>
                </div>
                </div>

                <div class="col-6">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" value="FR" id="fr">
                    <label class="form-check-label" for="fr">Francia</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" value="GB" id="gb">
                    <label class="form-check-label" for="gb">Gran Bretagna</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" value="NZ" id="nz">
                    <label class="form-check-label" for="nz">Nuova Zelanda</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" value="US" id="us">
                    <label class="form-check-label" for="us">Stati Uniti</label>
                </div>
                </div>
            </div>
            </div>

            
            <div class="col-md-4 mb-3">
            <label class="label-title mb-2">Numero di utenti generati</label>
            <div class="d-flex">
                <output for="range" id="rangeValue" aria-hidden="true" ></output>
                <input type="range" class="form-range ms-5" min="0" max="20" id="range">
            </div>
            </div>

        </div>

        
        <div class="text-center mb-4">
            <button id="BtnGenera" class="btn btn-beige px-4 py-2">
                Genera utente
            </button>
        </div>
        </div>
    </div>
    </div>

    <div class="d-flex align-items-center justify-content-center mt-5 d-none" id="search">
        <div class="d-flex">
                <input id="txtCerca" class="form-control me-2" type="text" placeholder="Search" aria-label="Search"/>
                <button id="btnCerca" class="btn">Cerca</button>
                <button id="btnPulisci" class="btn">Pulisci ricerca</button>
        </div>
    </div>

    <div id="userCard" class=" container text-center d-none mt-5 mb-5 users-card">
         
    </div>

</body>
</html>
